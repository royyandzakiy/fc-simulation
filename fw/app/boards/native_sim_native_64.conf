# printk and logs go to zephyr.exe's stdout through the native console and
# log backend, which the launching script reads.
CONFIG_UART_CONSOLE=n

# 10 kHz tick. The default 100 Hz rounds every k_usleep() up to 10 ms, which
# alone makes a lockstep round trip slower than the 4.17 ms control period.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Plain log lines: colour codes are noise once the plant prefixes and prints them.
CONFIG_LOG_BACKEND_SHOW_COLOR=n
