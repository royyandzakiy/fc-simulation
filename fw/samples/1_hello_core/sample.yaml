sample:
  name: fc core under Zephyr
common:
  tags: fc
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "crc8.* = 0xBC"
      - "m = 400 400 600 600"
      - "unaligned decode ok, seq 7 gyro.y -200"
tests:
  fc.samples.hello_core:
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
  fc.samples.hello_core.esp32:
    build_only: true
    platform_allow:
      - esp32_devkitc/esp32/procpu
